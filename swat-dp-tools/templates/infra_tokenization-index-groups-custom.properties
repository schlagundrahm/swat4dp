# ================================================================================================
# SWAT4DP Custom Tokenization Index Groups — Client Override File
# ================================================================================================
# Place this file at:  <customer>-swat-dp-infra/config/tokenization-index-groups-custom.properties
#
# Groups defined here are MERGED ON TOP of the standard groups in:
#   swat-dp-tools/config/tokenization-index-groups.properties
#
# If a group key exists in both files, the entry in THIS file replaces the standard one.
# This means you can extend a standard group by re-defining it here with additional types.
#
# Format: group.<name>=ObjectType1,ObjectType2,ObjectType3
#
# When multiple object types share the same group, they use a single continuous index
# counter rather than having separate counters per type.
#
# Examples:
#   # Extend the standard front-side handler group with a custom handler type
#   group.frontside.handlers=HTTPSourceProtocolHandler,HTTPSSourceProtocolHandler,CustomSSLHandler
#
#   # New group for backend handlers
#   group.backend.handlers=HTTPHandler,HTTPSHandler,JMSHandler
# ================================================================================================

