# ================================================================================================
# SWAT4DP Custom Tokenization Rules — Client Override File
# ================================================================================================
# Place this file at:  <customer>-swat-dp-infra/config/tokenization-rules-custom.properties
#
# Rules defined here are MERGED ON TOP of the standard rules in:
#   swat-dp-tools/config/tokenization-rules.properties
#
# If a key exists in both files, the entry in THIS file wins.
# Use this file to:
#   - Add rules for DataPower object types not covered by the standard rules
#   - Override a standard rule with a different token name
#   - Comment out a standard rule (not possible here — use a different token name instead)
#
# Format: XPath.expression=token.name
#   XPath uses dot notation relative to //configuration/
#   Use {index} in the token name for indexed (multi-instance) objects
#
# Examples:
#   CustomObject.LocalAddress=custom.address
#   CustomMPG.FrontProtocol.@class=custom.fsh.{index}.class
#   CustomMPG.FrontProtocol=custom.fsh.{index}.name
# ================================================================================================

