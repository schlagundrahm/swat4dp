# ================================================================================================
# SWAT4DP Tokenization Index Groups Configuration
# ================================================================================================
# This file defines groups of object types that should share the same index sequence.
# 
# Format: group.name=ObjectType1,ObjectType2,ObjectType3
#
# When multiple object types are in the same group, they will share a continuous index
# across all instances, rather than having separate index sequences.
#
# Example:
#   If a service has:
#     - HTTPSourceProtocolHandler (1st)
#     - HTTPSSourceProtocolHandler (2nd)
#     - HTTPSourceProtocolHandler (3rd)
#   
#   Without grouping: HTTP gets index 1,2 and HTTPS gets index 1
#   With grouping: They get continuous indexes 1,2,3
# ================================================================================================

# ================================================================================================
# FRONT SIDE HANDLERS GROUP
# ================================================================================================
# HTTP and HTTPS source protocol handlers should share the same index sequence
# because they represent alternative front-side handlers for the same service
group.frontside.handlers=HTTPSourceProtocolHandler,HTTPSSourceProtocolHandler

# ================================================================================================
# ADDITIONAL GROUPS
# ================================================================================================
# Add more groups as needed following the same pattern
# Example: group.backend.handlers=HTTPHandler,HTTPSHandler,MQHandler

