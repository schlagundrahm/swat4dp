# ================================================================================================
# SWAT4DP Tokenization Rules Configuration
# ================================================================================================
# This file defines which XML elements should be tokenized and what token names to use.
# Format: XPath.expression=token.name
#
# The XPath is relative to //configuration/ and uses dot notation for nested elements
# Example: ServiceType.ElementName.NestedElement=token.name
# ================================================================================================

